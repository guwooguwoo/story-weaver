name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Package
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then cp index.html www/index.html; fi
          if [ -f "storyweaver.html" ] && [ ! -f "www/index.html" ]; then cp storyweaver.html www/index.html; fi
          if [ -f "icon-512.png" ] && [ ! -f "www/icon-512.png" ]; then cp icon-512.png www/icon-512.png; fi
          cat << 'EOF' > package.json
          {
            "name": "storyweaver",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap init StoryWeaver com.storyweaver.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryWeaver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
