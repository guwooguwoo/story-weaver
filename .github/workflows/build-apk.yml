name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap init StoryWeaver com.storyweaver.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply Custom App Icon (www/icon-512.png)
        run: |
          if [ -f "www/icon-512.png" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert www/icon-512.png -resize 192x192 "$dir/ic_launcher.png"
                convert www/icon-512.png -resize 192x192 "$dir/ic_launcher_round.png"
                convert www/icon-512.png -resize 288x288 -background none -gravity center -extent 432x432 "$dir/ic_launcher_foreground.png"
              fi
            done
            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#6366f1</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryWeaver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
