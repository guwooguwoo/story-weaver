name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub 웹에서 수동으로 빌드 버튼을 누를 수 있게 해줍니다.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Java JDK 17 설치 (Android 빌드 필수)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Capacitor 및 플러그인 설치
        run: npm install

      - name: 5. Android 프로젝트 초기화 및 동기화
        run: |
          npx cap init "StoryWeaver" "com.storyweaver.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: 6. 준비된 투명 PNG 아이콘 자동 적용
        run: |
          if [ -f "assets/icon-only.png" ]; then
            cp -f assets/icon-only.png assets/icon.png
            cp -f assets/icon-only.png assets/splash.png
            npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          else
            echo "⚠️ assets/icon-only.png 파일을 찾을 수 없습니다!"
          fi


      - name: 7. 안드로이드 파일 저장 권한(AndroidManifest.xml) 추가
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <application/' $MANIFEST

      - name: 8. 디버그 APK 빌드 실행
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. 완성된 APK 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: StoryWeaver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
