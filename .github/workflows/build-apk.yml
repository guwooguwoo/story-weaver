name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Package
        run: |
          mkdir -p www
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then cp index.html www/index.html; fi
          if [ -f "storyweaver.html" ] && [ ! -f "www/index.html" ]; then cp storyweaver.html www/index.html; fi
          if [ -f "icon.ico" ] && [ ! -f "www/icon.ico" ]; then cp icon.ico www/icon.ico; fi
          cat << 'EOF' > package.json
          {
            "name": "storyweaver",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "@capacitor/filesystem": "^6.0.1",
              "@capacitor/share": "^6.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2"
            }
          }
          EOF

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap init StoryWeaver com.storyweaver.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply Custom .ico App Icon
        run: |
          if [ -f "www/icon.ico" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert "www/icon.ico[0]" -resize 192x192 PNG32:"$dir/ic_launcher.png"
                convert "www/icon.ico[0]" -resize 192x192 PNG32:"$dir/ic_launcher_round.png"
                convert "www/icon.ico[0]" -resize 192x192 PNG32:"$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryWeaver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
