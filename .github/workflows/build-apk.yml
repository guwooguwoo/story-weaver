name: Build Offline Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap init StoryWeaver com.storyweaver.app --web-dir www
          npx cap add android

      - name: Apply Custom PNG Icon (www/icon-512.png)
        run: |
          if [ -f "www/icon-512.png" ]; then
            mkdir -p assets
            cp www/icon-512.png assets/icon-only.png
            cp www/icon-512.png assets/icon-foreground.png
            npx capacitor-assets generate --android --iconBackgroundColor '#6366f1'
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryWeaver-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
